<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Clustering Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💳 Credit Card Transaction Analyzer</h1>
            <p>K-Means Clustering Model for Transaction Classification</p>
        </div>

        <div class="main-content">
            <div class="form-section">
                <h2>Enter Transaction Details</h2>
                <form id="transactionForm">
                    <div class="form-group">
                        <label for="amount">Transaction Amount ($)</label>
                        <input type="number" id="amount" name="amount" step="0.01" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="time">Transaction Time (24-hour format, 0-23)</label>
                        <input type="number" id="time" name="time" min="0" max="23" required>
                    </div>

                    <div class="form-group">
                        <label for="distance">Distance from Home (km)</label>
                        <input type="number" id="distance" name="distance" step="0.1" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="merchant_category">Merchant Category Code</label>
                        <input type="number" id="merchant_category" name="merchant_category" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="transaction_type">Transaction Type (0=Online, 1=In-Store)</label>
                        <select id="transaction_type" name="transaction_type" required>
                            <option value="">Select Type</option>
                            <option value="0">Online</option>
                            <option value="1">In-Store</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-submit">Analyze Transaction</button>
                </form>
            </div>

            <div class="result-section" id="resultSection" style="display: none;">
                <h2>Analysis Results</h2>
                <div class="result-card" id="resultCard"></div>
                <button class="btn-reset" onclick="resetForm()">Analyze Another Transaction</button>
            </div>

            <div class="model-info-section">
                <h3>Model Information</h3>
                <div id="modelInfo" class="model-info">
                    <p>Loading model information...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load model information on page load
        window.addEventListener('load', loadModelInfo);

        function loadModelInfo() {
            fetch('/model-info')
                .then(response => response.json())
                .then(data => {
                    const modelInfoDiv = document.getElementById('modelInfo');
                    if (data.model_loaded) {
                        modelInfoDiv.innerHTML = `
                            <p><strong>Number of Clusters:</strong> ${data.n_clusters}</p>
                            <p><strong>Number of Features:</strong> ${data.n_features}</p>
                            <p><strong>Model Inertia:</strong> ${data.inertia.toFixed(2)}</p>
                        `;
                    }
                })
                .catch(error => {
                    document.getElementById('modelInfo').innerHTML = '<p>Error loading model info</p>';
                });
        }

        document.getElementById('transactionForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = {
                amount: document.getElementById('amount').value,
                time: document.getElementById('time').value,
                distance: document.getElementById('distance').value,
                merchant_category: document.getElementById('merchant_category').value,
                transaction_type: document.getElementById('transaction_type').value
            };

            fetch('/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    displayResult(data, formData);
                } else {
                    showError(data.error);
                }
            })
            .catch(error => showError('Error: ' + error));
        });

        function displayResult(prediction, originalData) {
            const resultCard = document.getElementById('resultCard');
            
            const clusterColors = [
                '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8',
                '#F7DC6F', '#BB8FCE', '#85C1E2', '#F8B88B', '#A9DFBF'
            ];
            
            const clusterColor = clusterColors[prediction.cluster % clusterColors.length];

            resultCard.innerHTML = `
                <div class="result-header" style="border-left: 5px solid ${clusterColor}">
                    <h3>Cluster Assignment</h3>
                </div>
                <div class="result-details">
                    <div class="result-row">
                        <span class="label">Cluster Number:</span>
                        <span class="value cluster-badge" style="background-color: ${clusterColor}">
                            ${prediction.cluster}
                        </span>
                    </div>
                    <div class="result-row">
                        <span class="label">Distance to Cluster Center:</span>
                        <span class="value">${prediction.distance.toFixed(4)}</span>
                    </div>
                    <div class="result-row">
                        <span class="label">Classification Message:</span>
                        <span class="value">${prediction.message}</span>
                    </div>
                    
                    <hr>
                    
                    <h4>Input Features:</h4>
                    <div class="result-row">
                        <span class="label">Amount:</span>
                        <span class="value">$${parseFloat(originalData.amount).toFixed(2)}</span>
                    </div>
                    <div class="result-row">
                        <span class="label">Time:</span>
                        <span class="value">${originalData.time}:00</span>
                    </div>
                    <div class="result-row">
                        <span class="label">Distance:</span>
                        <span class="value">${parseFloat(originalData.distance).toFixed(2)} km</span>
                    </div>
                    <div class="result-row">
                        <span class="label">Merchant Category:</span>
                        <span class="value">${originalData.merchant_category}</span>
                    </div>
                    <div class="result-row">
                        <span class="label">Transaction Type:</span>
                        <span class="value">${originalData.transaction_type === '0' ? 'Online' : 'In-Store'}</span>
                    </div>
                </div>
            `;

            document.getElementById('resultSection').style.display = 'block';
            document.querySelector('.form-section').style.display = 'none';
        }

        function showError(error) {
            alert('Error: ' + error);
        }

        function resetForm() {
            document.getElementById('transactionForm').reset();
            document.getElementById('resultSection').style.display = 'none';
            document.querySelector('.form-section').style.display = 'block';
        }
    </script>
</body>
</html>
